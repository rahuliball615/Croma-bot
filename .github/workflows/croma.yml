name: Croma Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Telegram command"
        required: false
        default: ""
      chat_id:
        description: "Telegram chat id"
        required: false
        default: ""

concurrency:
  group: croma-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4 cloudscraper matplotlib

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_COMMAND: ${{ github.event.inputs.command }}
          TG_CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: python croma_bot.py

      - name: Save state
        run: |
          git config user.name "croma-bot"
          git config user.email "bot@users.noreply.github.com"
          git add croma_state.json || true
          git diff --staged --quiet || git commit -m "state update $(date -u +%Y-%m-%d_%H:%M)"
          git push || true
